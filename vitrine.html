<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração de Vitrine | MS Serviços</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Remove scrollbar completamente */
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0A1428;
    }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }

    :root {
      --blue: #1B62C0;
      --blue-light: #2B78D8;
      --white: #FFFFFF;
      --header-h: 80px;
    }

    /* ─── HEADER ─── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: var(--header-h);
      background: rgba(10, 20, 40, 0.98);
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      width: 100%;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-wrap img {
      height: 46px;
      width: auto;
      object-fit: contain;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .logo-text span:first-child {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: .95rem;
      color: var(--white);
    }

    .logo-text span:last-child {
      font-size: .68rem;
      color: var(--blue-light);
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(27,98,192,.15);
      border: 1px solid rgba(27,98,192,.3);
      border-radius: 100px;
      padding: 6px 18px 6px 12px;
    }

    .header-center i {
      color: var(--blue-light);
      font-size: .85rem;
    }

    .header-center span {
      font-size: .82rem;
      font-weight: 600;
      color: rgba(255,255,255,.8);
      letter-spacing: .5px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.15);
      transition: all .2s;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-back:hover {
      color: var(--white);
      border-color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.06);
    }

    /* ─── IFRAME ─── */
    .vitrine-wrap {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0;
      bottom: 0;
      width: 100%;
      overflow: hidden;
    }

    .vitrine-wrap iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 640px) {
      .header-inner { padding: 0 16px; }
      .logo-text span:last-child { display: none; }
      .header-center span { display: none; }
      .header-center { padding: 6px 12px; }
      .btn-back span { display: none; }
      .btn-back { padding: 8px 12px; }
    }

    @media (max-width: 390px) {
      .logo-wrap img { height: 36px; }
      .header-inner { padding: 0 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo-wrap">
        <img src="assets/logo.png" alt="Logo MS Serviços">
        <div class="logo-text">
          <span>MS Serviços</span>
          <span>Magno Santos</span>
        </div>
      </a>

      <div class="header-center">
        <i class="fas fa-store"></i>
        <span>Vitrine online</span>
      </div>

      <a href="index.html" class="btn-back">
        <i class="fas fa-arrow-left"></i>
        <span>Voltar ao site</span>
      </a>
    </div>
  </header>

  <div class="vitrine-wrap">
    <iframe
      src="https://magnosantoscosta.egestor.com.br/vitrine/"
      title="Vitrine MS Serviços"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>

</body>
</html>
